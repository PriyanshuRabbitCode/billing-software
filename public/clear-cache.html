<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Cache - Billing Software</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f0f23;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            text-align: center;
            background: #1a1a2e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 {
            color: #4f46e5;
            margin-bottom: 20px;
        }
        p {
            color: #d1d5db;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
            transition: background 0.2s;
        }
        .button:hover {
            background: #3730a3;
        }
        .button.secondary {
            background: #374151;
        }
        .button.secondary:hover {
            background: #4b5563;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .status.success {
            background: #065f46;
            color: #d1fae5;
        }
        .status.error {
            background: #991b1b;
            color: #fecaca;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Clear Application Cache</h1>
        <p>
            If you're experiencing chunk loading errors or the application isn't working properly, 
            clearing your browser cache can help resolve these issues.
        </p>
        
        <div>
            <button class="button" onclick="clearCache()">
                Clear Cache & Reload
            </button>
            <button class="button secondary" onclick="goToApp()">
                Go to Application
            </button>
        </div>
        
        <div id="status" class="status"></div>
    </div>

    <script>
        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        async function clearCache() {
            try {
                // Clear service worker cache
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const registration of registrations) {
                        await registration.unregister();
                    }
                }

                // Clear localStorage and sessionStorage
                localStorage.clear();
                sessionStorage.clear();

                // Clear IndexedDB
                if ('indexedDB' in window) {
                    const databases = await window.indexedDB.databases();
                    for (const db of databases) {
                        if (db.name) {
                            window.indexedDB.deleteDatabase(db.name);
                        }
                    }
                }

                showStatus('Cache cleared successfully! Redirecting to application...', 'success');
                
                // Redirect to the main application
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 2000);
                
            } catch (error) {
                console.error('Error clearing cache:', error);
                showStatus('Error clearing cache. Please try refreshing the page manually.', 'error');
            }
        }

        function goToApp() {
            window.location.href = '/dashboard';
        }

        // Auto-redirect after 10 seconds if user doesn't take action
        setTimeout(() => {
            if (!document.getElementById('status').style.display) {
                showStatus('Auto-redirecting to application...', 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 2000);
            }
        }, 10000);
    </script>
</body>
</html>
